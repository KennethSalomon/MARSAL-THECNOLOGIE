  ];

  const grid = document.getElementById('product-grid');
  let currentFilter = 'all';
  let searchTerm = '';

  function renderProducts() {
    const filtered = productsRaw.filter(p => {
      if (currentFilter !== 'all' && p.cat !== currentFilter) return false;
      if (searchTerm && !p.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
      return true;
    });
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>Aucun produit ne correspond.</p></div>`;
      return;
    }
    grid.innerHTML = filtered.map(p => `
      <article class="product-card">
        <div class="product-img"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
        <div class="product-body">
          <div class="product-cat">${p.cat === 'serrures' ? 'Serrure' : p.cat === 'cameras' ? 'Caméra' : p.cat === 'rideaux' ? 'Rideau' : p.cat === 'tablettes' ? 'Tablette' : p.cat === 'enceintes' ? 'Enceinte' : p.cat === 'telephones' ? 'Téléphone' : p.cat === 'energie' ? 'Énergie solaire' : p.cat === 'acces' ? 'Contrôle accès' : p.cat === 'hotel' ? 'Hôtellerie' : 'Autre'}</div>
          <div class="product-name">${p.name}</div>
          <a href="https://wa.me/22954036641?text=Je%20suis%20int%C3%A9ress%C3%A9%20par%20${encodeURIComponent(p.name)}" target="_blank" class="btn-product"><i class="fab fa-whatsapp"></i> Demander un devis</a>
        </div>
      </article>
    `).join('');
  }

  // Filtres
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
        renderProducts();
    });
  });
  document.getElementById('search-input').addEventListener('input', e => {
    searchTerm = e.target.value;
    renderProducts();
  });
  renderProducts();
</script>
