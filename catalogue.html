<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Marsal Technologies — Catalogue de produits domotiques et de sécurité intelligente." />
  <title>Catalogue · Marsal Technologies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Styles spécifiques à la page catalogue (préfixés cat-) */
    .cat-hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/images/catalogue.jpg');
      background-size: cover;
      background-position: center;
      padding: 5rem 0;
      margin-bottom: 2.5rem;
      text-align: center;
      color: white;
    }
    .cat-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .filter-wrapper {
      background: white;
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
      padding: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: nowrap;
      justify-content: flex-start;
      padding: 0.5rem;
    }
    .filter-tab {
      flex: 0 0 auto;
      background: #f1f5f9;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #1e2a3e;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .filter-tab i { margin-right: 0.5rem; }
    .filter-tab.active {
      background: var(--accent, #386FA8);
      color: white;
      box-shadow: 0 4px 8px rgba(56,111,168,0.2);
    }
    .filter-tab:hover:not(.active) {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .search-wrap {
      margin-bottom: 2rem;
      text-align: center;
    }
    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      border: 1px solid #e2e8f0;
      font-size: 0.9rem;
      background: white;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent, #386FA8);
      outline: none;
      box-shadow: 0 0 0 3px rgba(56,111,168,0.2);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 2rem;
      margin: 2rem 0;
    }
    .product-card {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px rgba(0,0,0,0.08);
      border-color: #cbd5e1;
    }
    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fafcff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      border-bottom: 1px solid #f0f2f5;
    }
    .product-img img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      transition: transform 0.4s;
    }
    .product-card:hover .product-img img {
      transform: scale(1.02);
    }
    .product-body {
      padding: 1.2rem 1.2rem 1.5rem;
    }
    .product-cat {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent, #386FA8);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .product-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #0f172a;
    }
    .btn-product {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent, #386FA8);
      color: white;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-product:hover {
      background: var(--accent-dark, #2c5582);
      transform: translateY(-2px);
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      color: #94a3b8;
    }
    @media (max-width: 700px) {
      .product-grid { gap: 1rem; }
      .filter-tab { padding: 0.5rem 1rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<header id="site-header" role="banner"></header>

  <div class="container">

        <button class="filter-tab" data-filter="serrures"><i class="fas fa-lock"></i> Serrures</button>
        <button class="filter-tab" data-filter="cameras"><i class="fas fa-video"></i> Caméras</button>
        <button class="filter-tab" data-filter="rideaux"><i class="fas fa-curtain"></i> Rideaux</button>
        <button class="filter-tab" data-filter="tablettes"><i class="fas fa-tablet-alt"></i> Tablettes</button>
        <button class="filter-tab" data-filter="enceintes"><i class="fas fa-music"></i> Enceintes</button>
        <button class="filter-tab" data-filter="telephones"><i class="fas fa-phone-alt"></i> Téléphones</button>
        <button class="filter-tab" data-filter="energie"><i class="fas fa-solar-panel"></i> Énergie solaire</button>
        <button class="filter-tab" data-filter="acces"><i class="fas fa-fingerprint"></i> Accès & Présence</button>
        <button class="filter-tab" data-filter="hotel"><i class="fas fa-hotel"></i> Barrière routière </button>
        <button class="filter-tab" data-filter="autres"><i class="fas fa-ellipsis-h"></i> Autres</button>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Rechercher un produit...">
    </div>

    <div class="product-grid" id="product-grid"></div>

</main>

  ];

  const grid = document.getElementById('product-grid');
  let currentFilter = 'all';
  let searchTerm = '';

  function renderProducts() {
    const filtered = productsRaw.filter(p => {
      if (currentFilter !== 'all' && p.cat !== currentFilter) return false;
      if (searchTerm && !p.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
      return true;
    });
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>Aucun produit ne correspond.</p></div>`;
      return;
    }
    grid.innerHTML = filtered.map(p => `
      <article class="product-card">
        <div class="product-img"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
        <div class="product-body">
          <div class="product-cat">${p.cat === 'serrures' ? 'Serrure' : p.cat === 'cameras' ? 'Caméra' : p.cat === 'rideaux' ? 'Rideau' : p.cat === 'tablettes' ? 'Tablette' : p.cat === 'enceintes' ? 'Enceinte' : p.cat === 'telephones' ? 'Téléphone' : p.cat === 'energie' ? 'Énergie solaire' : p.cat === 'acces' ? 'Contrôle accès' : p.cat === 'hotel' ? 'Hôtellerie' : 'Autre'}</div>
          <div class="product-name">${p.name}</div>
          <a href="https://wa.me/22954036641?text=Je%20suis%20int%C3%A9ress%C3%A9%20par%20${encodeURIComponent(p.name)}" target="_blank" class="btn-product"><i class="fab fa-whatsapp"></i> Demander un devis</a>
        </div>
      </article>
    `).join('');
  }

  // Filtres
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
        renderProducts();
    });
  });
  document.getElementById('search-input').addEventListener('input', e => {
    searchTerm = e.target.value;
    renderProducts();
  });
  renderProducts();
</script>
